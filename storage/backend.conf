# storage/backend.conf - Shared storage backend configuration for chat sync
# This config is shared across all agents. MinIO runs locally on each machine.
# For peer-to-peer sync, machines discover each other via the fleet config.

# MinIO endpoint (local by default)
MINIO_ENDPOINT="http://localhost:9000"
MINIO_BUCKET="chats"
MINIO_ACCESS_KEY="mainframe"
MINIO_SECRET_KEY="mainframe-chats-secret"

# Litestream configuration
LITESTREAM_INTERVAL="1s"          # replication interval
LITESTREAM_SNAPSHOT_INTERVAL="24h" # snapshot interval for clean recovery points

# Sync mode: "peer" (peer-to-peer via fleet SSH) or "hub" (single MinIO server)
SYNC_MODE="peer"

# Peer discovery: "fleet" (use fleet config) or "manual" (list peers below)
PEER_DISCOVERY="tailscale"  # discover peers via Tailscale mesh
# PEERS="user@host1,user@host2"  # only used if PEER_DISCOVERY=manual
# With Tailscale, peers are discovered automatically via: tailscale status
