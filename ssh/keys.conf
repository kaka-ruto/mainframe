# ssh/keys.conf - SSH keys to fetch from password manager
# Format: <bitwarden_item_name>:<path>
# Lines starting with # are comments.
# The path supports ~ for home directory.

GitHub SSH Key:~/.ssh/id_ed25519
dev-mf SSH Key:~/.ssh/dev-mf
app-mf SSH Key:~/.ssh/app-mf

data-mf SSH Key:~/.ssh/data-mf
infra-mf SSH Key:~/.ssh/infra-mf
