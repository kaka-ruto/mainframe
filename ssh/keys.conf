# ssh/keys.conf - SSH keys to fetch from Infisical
# Format: <infisical_secret_name>:<path>
# Lines starting with # are comments.
# The path supports ~ for home directory.

SSH_KEY_GITHUB:~/.ssh/id_ed25519
SSH_KEY_DEV_MF:~/.ssh/dev-mf
SSH_KEY_APP_MF:~/.ssh/app-mf
SSH_KEY_DATA_MF:~/.ssh/data-mf
SSH_KEY_INFRA_MF:~/.ssh/infra-mf
