mode: dev

tailscale:
  enabled: true

firewall:
  mode: tailscale-only
  extra_ports: []

hardening:
  ssh_crypto: true
  bbr: true
  apparmor: true
  unattended: true
  needrestart: true
  swap: true
  journald: true
  etckeeper: true
  deadman: true
  fail2ban: true

secrets:
  backend: bitwarden
  items:
    - name: ssh-key-github
      type: ssh_key
      path: ~/.ssh/id_ed25519
      bitwarden_item: "GitHub SSH Key"
    - name: ssh-key-dev-mf
      type: ssh_key
      path: ~/.ssh/dev-mf
      bitwarden_item: "dev-mf SSH Key"
    - name: ssh-key-app-mf
      type: ssh_key
      path: ~/.ssh/app-mf
      bitwarden_item: "app-mf SSH Key"
    - name: ssh-key-data-mf
      type: ssh_key
      path: ~/.ssh/data-mf
      bitwarden_item: "data-mf SSH Key"
    - name: ssh-key-infra-mf
      type: ssh_key
      path: ~/.ssh/infra-mf
      bitwarden_item: "infra-mf SSH Key"

packages: packages.conf
runtimes: runtimes.conf

dev:
  shell: shell/
  git: git/
  editor: editor/
  terminal: terminal/
  ssh: ssh/
  bin: bin/
  skills: skills/
  mcp:
    registry: mcp/registry.json
    config: mcp/config.json
  os: os/darwin.sh

# prod: section (for production-specific config)
# prod:
#   packages: packages.prod.conf
#   os: os/linux.sh
#   monitoring: monitoring/

agents:
  registry: agents/registry.json
  enabled:
    - zcode
