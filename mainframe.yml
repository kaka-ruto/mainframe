mode: dev

tailscale:
  enabled: true

firewall:
  mode: tailscale-only
  extra_ports: []

hardening:
  ssh_crypto: true
  bbr: true
  apparmor: true
  unattended: true
  needrestart: true
  swap: true
  journald: true
  etckeeper: true
  deadman: true
  fail2ban: true

secrets:
  backend: infisical
  host: "http://localhost:8080"
  project: "61ea639c-fd0c-4ccf-ba5f-cedd12eb72db"
  environment: "dev"
  # Machine identity credentials are stored in ~/.infisical/ or env vars:
  #   INFISICAL_CLIENT_ID, INFISICAL_CLIENT_SECRET
  # Bootstrap: store these in a secure location (e.g., one-time manual entry)
  items:
    - name: SSH_KEY_GITHUB
      type: ssh_key
      path: ~/.ssh/id_ed25519
      infisical_path: /ssh
    - name: SSH_KEY_DEV_MF
      type: ssh_key
      path: ~/.ssh/dev-mf
      infisical_path: /ssh
    - name: SSH_KEY_APP_MF
      type: ssh_key
      path: ~/.ssh/app-mf
      infisical_path: /ssh
    - name: SSH_KEY_DATA_MF
      type: ssh_key
      path: ~/.ssh/data-mf
      infisical_path: /ssh
    - name: SSH_KEY_INFRA_MF
      type: ssh_key
      path: ~/.ssh/infra-mf
      infisical_path: /ssh
    - name: INFISICAL_HOST
      type: env
      var: INFISICAL_HOST
      infisical_path: /infisical
    - name: INFISICAL_PROJECT_ID
      type: env
      var: INFISICAL_PROJECT_ID
      infisical_path: /infisical
    - name: INFISICAL_CLIENT_ID
      type: env
      var: INFISICAL_CLIENT_ID
      infisical_path: /infisical
    - name: INFISICAL_CLIENT_SECRET
      type: env
      var: INFISICAL_CLIENT_SECRET
      infisical_path: /infisical

packages: packages.conf
runtimes: runtimes.conf

dev:
  shell: shell/
  git: git/
  editor: editor/
  terminal: terminal/
  ssh: ssh/
  bin: bin/
  skills: skills/
  mcp:
    registry: mcp/registry.json
    config: mcp/config.json
  os: os/darwin.sh

# prod: section (for production-specific config)
# prod:
#   packages: packages.prod.conf
#   os: os/linux.sh
#   monitoring: monitoring/

agents:
  registry: agents/registry.json
  enabled:
    - zcode
