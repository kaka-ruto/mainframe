# OpenCode chat sync configuration
# Syncs OpenCode session database

AGENT="opencode"

# Sync mode: "litestream" (SQLite)
SYNC_MODE="litestream"

# Paths to sync (relative to $HOME)
# Note: OpenCode data dir is configured to ~/.opencode/ by mainframe
PATHS=(
    ".opencode/opencode.db"
)

# Litestream replica keys
LITESTREAM_REPLICAS=(
    "opencode/db:~/.opencode/opencode.db"
)

# Pre-sync: checkpoint WAL to main DB
PRE_SYNC_SCRIPT="sqlite3 \$HOME/.opencode/opencode.db 'PRAGMA wal_checkpoint(TRUNCATE);'"
