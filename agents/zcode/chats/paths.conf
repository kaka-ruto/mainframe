# ZCode chat sync configuration
# Syncs ZCode task index, CLI database, and rollout transcripts

# Agent identifier
AGENT="zcode"

# Sync mode: "litestream" (SQLite) + "file-watch" (transcripts)
SYNC_MODE="litestream+files"

# Paths to sync (relative to $HOME)
PATHS=(
    ".zcode/v2/tasks-index.sqlite"
    ".zcode/cli/db.sqlite"
    ".zcode/cli/rollout/"
)

# Litestream replica keys (one per SQLite DB)
LITESTREAM_REPLICAS=(
    "zcode/tasks-index:~/.zcode/v2/tasks-index.sqlite"
    "zcode/cli-db:~/.zcode/cli/db.sqlite"
)

# File patterns to watch for changes (transcripts)
WATCH_PATTERNS=(
    ".zcode/cli/rollout/*.jsonl"
)

# Pre-sync: checkpoint WAL to main DB
PRE_SYNC_SCRIPT="sqlite3 \$HOME/.zcode/v2/tasks-index.sqlite 'PRAGMA wal_checkpoint(TRUNCATE);' && sqlite3 \$HOME/.zcode/cli/db.sqlite 'PRAGMA wal_checkpoint(TRUNCATE);'"
